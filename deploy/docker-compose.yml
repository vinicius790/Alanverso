services:
  alanverso:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: alanverso:5.0.0
    container_name: alanverso-web
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
