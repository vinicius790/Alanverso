name: CI - Alanverso v5.0.0 (Qualidade, Segurança e Testes)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao-principal:
    name: Sintaxe, Bundle Budget, Testes Nativos e Linter HTML
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar verificação unificada (sintaxe ES/CSS, orçamento de módulos e 30 testes)
        run: npm run check

      - name: Validação estrutural de HTML (htmlhint)
        run: |
          npx --yes htmlhint "index.html" --rules "tagname-lowercase,attr-lowercase,attr-value-double-quotes,tag-pair,id-unique,src-not-empty,title-require"

  auditoria-seguranca:
    name: Auditoria DevSecOps (Anti-XSS, UTF-8 e Segredos)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar auditoria de segurança e integridade do repositório
        run: node --test tests/infra/security.test.js
